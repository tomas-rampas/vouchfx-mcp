# Keeps GitHub Actions references in .github/workflows/ and NuGet package
# references maintained.
#
# github-actions: every workflow pins every third-party action to a full commit
# SHA for supply-chain integrity; without this ecosystem entry those pins would
# silently rot. Dependabot updates SHA pins and their trailing version comments
# together.
#
# nuget: keeps the solution's package references (the MCP SDK and the server's other
# runtime dependencies, and the test stack) current.
#
# LOCK FILES AND DEPENDABOT (issue #79) — a manual step Dependabot's nuget updater
# cannot do for us. This repo pins RestorePackagesWithLockFile=true (Directory.Build.props),
# so every project carries a committed packages.lock.json and CI restores run
# --locked-mode (build.yml/release.yml). Dependabot's nuget updater regenerates ONLY the
# lock file of the project whose PackageReference it bumped — it does not re-walk
# ProjectReferences, so a bump to src/Vouchfx.Mcp/Vouchfx.Mcp.csproj's packages.lock.json
# leaves tests/Vouchfx.Mcp.Tests/packages.lock.json (which ProjectReferences it, and so
# transitively depends on the same bumped package) STALE — see dependabot/dependabot-core#12318,
# which documents exactly this ProjectReference-lock-file gap and remains open. A stale
# downstream lock file fails the downstream project's --locked-mode restore with NU1004 in
# CI on Dependabot's own PR, which looks like a Dependabot regression but is not one.
# REMEDY on any Dependabot nuget PR that goes red on NU1004: check out the PR branch, run
# `dotnet restore Vouchfx.Mcp.sln` (no --locked-mode — this regenerates every project's lock
# file, not just the one Dependabot touched), then commit the regenerated
# packages.lock.json file(s) onto the PR branch and push. The `groups:` block below exists
# partly to make this a once-a-week cost rather than a per-PR one — see its own comment.
#
# AUTOMATION: .github/workflows/dependabot-lockfiles.yml applies that remedy to Dependabot
# nuget PRs and pushes the regenerated lock files with its own GITHUB_TOKEN.
# MAINTAINER ACTIONS:
#   1. After the workflow pushes, select "Approve workflows to run" on the PR. GitHub creates
#      the CI runs for a GITHUB_TOKEN push but holds them until someone with write access
#      approves them. If no "Approve workflows to run" banner appears on the PR, close the
#      PR and reopen it straight away: a reopen by a person starts CI normally, and the
#      workflow skips that run.
#   2. Make `Build & unit tests` a required status check on main (branch protection or a
#      ruleset), so a PR whose CI is red, or still waiting for approval, cannot be merged.
# A BRANCH SOMEONE ELSE HAS EDITED: the workflow runs only on Dependabot's own pushes.
# Comment `@dependabot recreate` (it discards the edits), or regenerate by hand as above.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # codeql-action's init and analyze must move together. The analyze step refuses a
    # configuration written by a different init version (MEASURED on #118/#119,
    # 2026-09-21: "Loaded a configuration file for version '4.38.1', but running
    # version '4.37.9'"). Ungrouped, each bump arrives as its own PR and each PR fails
    # CodeQL on its own. This is the same group the engine repo's dependabot.yml
    # declares.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Collapses every NuGet update this week into ONE pull request instead of one per
    # package. Two independent reasons, and the lock-file one is new with issue #79: (1) the
    # ordinary reason — fewer PRs to triage; (2) it pays the manual lock-file-regeneration
    # remedy documented above ONCE per week rather than once per bumped package, since a
    # multi-package PR still needs exactly one `dotnet restore Vouchfx.Mcp.sln` + commit
    # regardless of how many packages it touches. That remedy is now automated
    # (.github/workflows/dependabot-lockfiles.yml), so the grouping means one approval of
    # the held CI runs per week.
    groups:
      nuget-dependencies:
        patterns:
          - "*"
    # YamlDotNet is pinned to the vouchfx ENGINE repo's own centrally-pinned version, not to
    # whatever nuget.org publishes next — fleet consistency (YAML scalar-resolution parity
    # with the engine's validate_suite verdicts) is a correctness property here, mechanically
    # enforced by EngineYamlDotNetPinParityTests, and the full rationale lives in the
    # PackageReference "YamlDotNet" comment in src/Vouchfx.Mcp/Vouchfx.Mcp.csproj. PR #120
    # proposed 16.3.0 -> 18.1.0 (Dependabot's group bump); evaluated and rejected on exactly
    # this ground. Do not remove this entry without re-reading that comment; a genuine advance
    # here only ever follows the engine's own Directory.Packages.props pin, never Dependabot's
    # proposal, per the procedure that comment records.
    ignore:
      - dependency-name: "YamlDotNet"
      # Microsoft.CodeAnalysis.CSharp (test-only) follows the engine repo's central pin, and a
      # major bump is a toolchain question rather than a package one: 5.9.0 was measured (PR #120,
      # reproduced on this branch) to fail `dotnet build -warnaserror` with CS9057, because its
      # analyzer assembly targets compiler 4.12.0.0 while the pinned .NET 8 SDK ships 4.11.0.0.
      # Minor and patch proposals still arrive and are evaluated on their merits; a major advance
      # waits for an SDK pin whose compiler clears that floor. (That measurement was taken
      # while the SDK pin was .NET 8; the pin is now .NET 10 and the 5.9.0 result has not
      # been re-measured on it, so the ignore rule stays until someone does.) The full account is the
      # PackageReference comment in tests/Vouchfx.Mcp.Tests/Vouchfx.Mcp.Tests.csproj.
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
        update-types: ["version-update:semver-major"]
      # The four packages that follow the .NET release train (Microsoft.Extensions.Hosting,
      # Microsoft.Extensions.FileSystemGlobbing, System.Diagnostics.DiagnosticSource and
      # System.Text.Encoding.CodePages) stay on the 10.0.x band while this tool targets net10.0
      # and runs on the .NET 10 runtime and the ASP.NET Core 10 shared framework. MEASURED on the
      # proposed 10.0.14 -> 11.0.0 group bump (2026-11-22): the net10.0 restore graph grew from 40 to
      # 43 packages (System.Text.Json, System.IO.Pipelines and System.Text.Encodings.Web, which
      # restore prunes at 10.0.x, entered it), and the packed tool's deps.json grew from 13 libraries
      # (10 assemblies) to 43 (43 assemblies): 33 more assemblies (36 more DLL files, counting the
      # Windows- and browser-specific copies) would ship beside the application, among them 27
      # Microsoft.Extensions.* assemblies, DiagnosticSource, CodePages and System.Text.Json. At
      # 10.0.x those Microsoft.Extensions.* packages are in the locked graph but drop out of
      # deps.json at build (see CLAUDE.md); at 11.0.0 they no longer do.
      # The Release build with -warnaserror also failed (CA2263 in
      # tests/Vouchfx.Mcp.Tests/Tools/StructuredToolResultTests.cs, with System.Text.Json 11.0.0 in
      # that project's restore graph). Only the major bump is held: patch and minor updates below
      # 11.0 still arrive through the weekly group, which is how .NET 10 servicing fixes
      # reach these packages. There is deliberately no `versions:` range. Dependabot security
      # updates are not enabled for this repository (checked 2026-11-22); Dependabot alerts and
      # NuGetAudit (which fails restore) are what flag an advisory. If security updates are ever
      # enabled, whether a security job honours an `update-types` ignore is not settled (the NuGet
      # updater applies it to every job), so a fix published only on 11.x could be held.
      # The two Microsoft.Extensions packages are named one by one, not by wildcard, so that a
      # Microsoft.Extensions.* package on another version line is not held by accident; add a
      # release-train package here when it becomes a direct reference.
      # Lift the hold when the tool moves to net11.0, and re-measure first.
      - dependency-name: "Microsoft.Extensions.Hosting"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.FileSystemGlobbing"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Diagnostics.DiagnosticSource"
        update-types: ["version-update:semver-major"]
      - dependency-name: "System.Text.Encoding.CodePages"
        update-types: ["version-update:semver-major"]
