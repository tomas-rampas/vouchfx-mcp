# .github/workflows/dependabot-lockfiles.yml — regenerate stale packages.lock.json files on
# Dependabot NuGet pull requests.
#
# Why: every project commits a packages.lock.json and CI restores with --locked-mode.
# Dependabot's nuget updater regenerates only the lock file of the project whose
# PackageReference it bumped (dependabot/dependabot-core#12318), so a bump to
# src/Vouchfx.Mcp leaves the lock files of the projects that reference it stale and CI
# fails with NU1004. The manual remedy is documented in .github/dependabot.yml; this
# workflow performs it.
#
# Shape: TWO jobs, so that the job that runs the pull request's MSBuild logic and
# downloads its packages holds no write access at all.
#   refresh  (contents: read): checks out the pull request head commit, runs
#            `dotnet restore Vouchfx.Mcp.sln --force-evaluate`, and uploads ONLY the
#            lock files that changed, as an artefact. Untrusted-input stage.
#   commit   (contents: write): downloads that artefact as DATA, accepts only files named
#            packages.lock.json at paths that are already tracked, whose packages all
#            already appear in a lock file on the branch, commits exactly those and pushes
#            them to the pull request branch. It never runs dotnet, MSBuild or anything
#            from the pull request.
#
# Why the job's own GITHUB_TOKEN and no stored token: a stored token with write access
# could publish a release, and release.yml would build and publish it to nuget.org,
# whereas a release made with GITHUB_TOKEN starts no workflow and the token expires when
# the job ends.
# The cost: for a GITHUB_TOKEN push GitHub creates the pull request's CI runs but holds
# them until someone with write access selects "Approve workflows to run" on the pull
# request. The commit job's summary says so after each push.
#
# Who may run it (job-level condition, repeated on both jobs):
#   - the pull request's author is dependabot[bot];
#   - github.actor is dependabot[bot], i.e. Dependabot itself made the push or opened
#     the pull request. A human who pushes a commit to a Dependabot branch becomes the
#     actor, so the jobs are skipped and a human-edited branch never reaches the push
#     step. This also breaks the loop: the push below is made as github-actions[bot],
#     so the synchronize event it causes has that actor (and whoever approves the held
#     run is not dependabot[bot] either), and both jobs skip;
#   - the head branch lives in THIS repository (a fork cannot match) and is named
#     dependabot/nuget/...
# The trigger is `pull_request`, never `pull_request_target`: the workflow definition is
# the one on the pull request's merge ref, and a Dependabot-actor run is treated like a
# fork run by GitHub (read-only GITHUB_TOKEN unless `permissions:` raises it).
#
# The commit message carries [dependabot skip], so Dependabot keeps rebasing the pull
# request and force-pushes over this commit; that push has dependabot[bot] as actor, and
# the workflow regenerates the lock files again.
#
# Maintainer actions: approve the held workflow runs after this workflow pushes, and make
# `Build & unit tests` a required status check on main (a run waiting for approval does
# not satisfy it). Details: .github/dependabot.yml header.
name: Dependabot lock files

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - "**/*.csproj"
      - "**/packages.lock.json"
      - "**/Directory.*.props"
      - "**/Directory.*.targets"

# Read by default; only the commit job raises contents to write.
permissions:
  contents: read

# One run per pull request; a newer Dependabot push supersedes an older run, whose push
# would otherwise be refused as non-fast-forward. This workflow's own push also lands in
# this group: if its run starts before the pushing run has finished, the cancellation
# can only change the pushing run's displayed status, because the push is already done
# and the new run's jobs skip.
concurrency:
  group: dependabot-lockfiles-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  refresh:
    name: Regenerate lock files (no write access)
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/nuget/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.collect.outputs.changed }}

    steps:
      # The pull request HEAD commit, not the merge ref: the lock files must be generated
      # from, and later committed onto, the branch itself. Pinning to the event's SHA means
      # a push that lands after this run started cannot change what is restored.
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # No credential is persisted: this job runs the pull request's MSBuild logic and
          # must not be able to push even by accident.
          persist-credentials: false

      # Same SDK selection as build.yml, so the lock files are generated by the toolchain
      # CI restores with ("10.0.x" satisfies global.json).
      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"

      # NOT --locked-mode: this is the step that re-resolves. --force-evaluate is the option
      # NU1004's own message names; it re-evaluates every project and rewrites any lock file
      # that differs. MEASURED on this repository: after a src/Vouchfx.Mcp bump the plain
      # restore and --force-evaluate rewrite identical files, and a second run changes nothing.
      - name: Restore (regenerate lock files)
        run: dotnet restore Vouchfx.Mcp.sln --force-evaluate

      - name: Collect changed lock files
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          git status --porcelain -- ':(glob)**/packages.lock.json'
          out="$RUNNER_TEMP/lockfiles-out"
          mkdir -p "$out"
          mapfile -d '' changed < <(git diff --name-only -z -- ':(glob)**/packages.lock.json')
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "Lock files are already current; nothing to push."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp --parents -- "${changed[@]}" "$out/"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Upload regenerated lock files
        if: steps.collect.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: regenerated-lock-files
          path: ${{ runner.temp }}/lockfiles-out
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit lock files to the pull request branch
    needs: refresh
    # `changed` is only a boolean gate. Its value is produced inside the job that runs
    # untrusted MSBuild logic, so this job treats the artefact itself as untrusted and
    # re-validates everything below.
    if: >-
      needs.refresh.outputs.changed == 'true' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/nuget/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The only write scope in this file. It is used by the single push command below.
    permissions:
      contents: write

    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # The token is given to git for the single push command below instead of being
          # written to .git/config for the whole job.
          persist-credentials: false

      - name: Download regenerated lock files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: regenerated-lock-files
          path: ${{ runner.temp }}/lockfiles-in

      # The artefact came from a job that executed pull request code, so it is data to be
      # checked, not trusted. Only a file named packages.lock.json, at a plain relative path
      # that git already tracks and that is not a symbolic link, is copied into the tree.
      # Each copied file must be a NuGet lock document, and every package it resolves (id,
      # version and content hash) must already appear in a lock file on the branch: the
      # downstream lock files only repeat what Dependabot's own update resolved, so a
      # package that appears nowhere on the branch did not come from the update.
      # Artefact names are printed with %q, so a newline in a name cannot start a workflow
      # command in the log. Python runs with -I, so nothing in the checkout is imported.
      - name: Validate and stage lock files
        shell: bash
        env:
          INCOMING: ${{ runner.temp }}/lockfiles-in
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            rel="${file#"$INCOMING"/}"
            shown="$(printf '%q' "$rel")"
            if [ -L "$file" ] || [ ! -f "$file" ]; then
              echo "::error::Refusing non-regular artefact entry: $shown"; exit 1
            fi
            if ! [[ "$rel" =~ ^([A-Za-z0-9_][A-Za-z0-9._-]*/)*packages\.lock\.json$ ]]; then
              echo "::error::Refusing artefact entry that is not a packages.lock.json at a plain path: $shown"; exit 1
            fi
            if ! git ls-files --error-unmatch -- "$rel" > /dev/null 2>&1; then
              echo "::error::Refusing lock file that is not already tracked: $shown"; exit 1
            fi
            cp -- "$file" "$rel"
            count=$((count + 1))
          done < <(find "$INCOMING" ! -type d -print0)
          if [ "$count" -eq 0 ]; then
            echo "::error::The artefact held no lock files."; exit 1
          fi
          # Fail unless the working tree differs from HEAD in lock files only.
          if git status --porcelain --untracked-files=all | grep -v -E '^ M (.*/)?packages\.lock\.json$'; then
            echo "::error::Something other than a modified packages.lock.json is in the tree."; exit 1
          fi
          if git diff --quiet; then
            echo "Artefact matches the branch; nothing to commit."
            exit 0
          fi
          mapfile -d '' changed < <(git diff --name-only -z)
          python3 -I - "$RUNNER_TEMP/lockfile-changes.md" "${changed[@]}" <<'PY'
          import json, subprocess, sys

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          def load(text, where):
              try:
                  doc = json.loads(text)
              except (ValueError, RecursionError):
                  fail(f"Refusing {where}: not JSON.")
              if not (isinstance(doc, dict) and isinstance(doc.get("version"), int)
                      and isinstance(doc.get("dependencies"), dict)):
                  fail(f"Refusing {where}: not a NuGet lock document.")
              entries = {}
              for target, packages in doc["dependencies"].items():
                  if not isinstance(packages, dict):
                      fail(f"Refusing {where}: malformed target {ascii(target)}.")
                  for package, entry in packages.items():
                      if not isinstance(entry, dict):
                          fail(f"Refusing {where}: malformed entry {ascii(package)}.")
                      entries[(target, package.lower())] = (package, entry)
              return entries

          def at_head(path):
              return subprocess.run(["git", "show", f"HEAD:{path}"], check=True,
                                    capture_output=True, text=True).stdout

          tracked = subprocess.run(["git", "ls-tree", "-r", "-z", "--name-only", "HEAD"], check=True,
                                   capture_output=True, text=True).stdout.split("\0")
          known = set()
          for path in tracked:
              if path.rsplit("/", 1)[-1] == "packages.lock.json":
                  for (_, key), (_, entry) in load(at_head(path), f"branch file {path}").items():
                      known.add((key, entry.get("resolved"), entry.get("contentHash")))

          report = []
          for path in sys.argv[2:]:
              with open(path, encoding="utf-8") as handle:
                  new = load(handle.read(), path)
              for (_, key), (package, entry) in new.items():
                  if entry.get("type") == "Project":
                      continue
                  resolved, digest = entry.get("resolved"), entry.get("contentHash")
                  if not (isinstance(resolved, str) and isinstance(digest, str)
                          and (key, resolved, digest) in known):
                      fail(f"Refusing {path}: {ascii(package)} {ascii(resolved)} with that content hash"
                           " is not already in a lock file on the branch.")
              old = load(at_head(path), f"branch file {path}")
              for key in sorted(old.keys() | new.keys()):
                  before = old[key][1].get("resolved") if key in old else None
                  after = new[key][1].get("resolved") if key in new else None
                  if before != after:
                      name = (new.get(key) or old[key])[0]
                      report.append(f"| `{path}` | `{name}` | {before or '-'} | {after or '-'} |")

          with open(sys.argv[1], "w", encoding="utf-8") as out:
              if report:
                  out.write("| Lock file | Package | Before | After |\n|---|---|---|---|\n")
                  out.write("\n".join(report) + "\n")
          PY
          git diff --name-only -z | xargs -0 git add --
          git diff --cached --name-only

      - name: Commit and push
        shell: bash
        env:
          PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --cached --quiet; then
            echo "Nothing staged; the branch already carries current lock files."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # [dependabot skip] lets Dependabot keep rebasing the pull request over this commit.
          # Hooks are off for both git commands: nothing in .git/hooks is trusted here.
          git -c core.hooksPath=/dev/null commit \
            -m "build(deps): regenerate packages.lock.json files [dependabot skip]" \
            -m "Dependabot's NuGet updater refreshes only the lock file of the project it bumped; this restores the others so locked-mode CI sees a consistent tree." \
            --trailer "Workflow-run: $run_url"
          # Only lock files may be in the commit.
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -v -E '(^|/)packages\.lock\.json$'; then
            echo "::error::The commit contains a file other than packages.lock.json."; exit 1
          fi
          auth="$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          # The credential reaches git through its environment, not its command line (which
          # other processes can read), and is never written to .git/config. Plain
          # (non-force) push: if the branch moved since this run started, the push is
          # refused rather than overwriting someone else's commit.
          if ! GIT_CONFIG_COUNT=1 \
               GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
               GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
               git -c core.hooksPath=/dev/null push origin "HEAD:refs/heads/$HEAD_REF"; then
            echo "::error title=Lock file push failed::The push was refused, most likely because the branch moved since this run started. Comment '@dependabot rebase' on the pull request to start again."
            exit 1
          fi
          {
            echo "### Lock files regenerated and pushed"
            echo
            echo "The regenerated packages.lock.json files were pushed to this pull request's branch as $(git rev-parse --short HEAD)."
            echo "GitHub holds the CI runs for that commit: someone with write access must select **Approve workflows to run** on the pull request so that CI runs on the new commit."
            echo
            echo '```'
            git show --stat --format= HEAD
            echo '```'
            echo
            cat "$RUNNER_TEMP/lockfile-changes.md"
          } >> "$GITHUB_STEP_SUMMARY"
