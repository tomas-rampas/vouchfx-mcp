name: Required real CLI probes

on:
  workflow_call:
    inputs:
      dotnet_sdk:
        description: Isolated MCP SDK/runtime line
        required: false
        default: '8.0'
        type: string

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  real-probes:
    name: Required real CLI probes${{ inputs.dotnet_sdk != '8.0' && format(' .NET {0}', inputs.dotnet_sdk) || '' }}
    runs-on: ubuntu-latest
    # The four method budgets total at most 17 minutes; setup needs additional time.
    timeout-minutes: 30
    steps:
      - name: Checkout MCP
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read exact public engine pin
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          read -r version commit < ENGINE_PIN
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'version=%s\ncommit=%s\n' "${version#v}" "$commit" >> "$GITHUB_OUTPUT"
      - name: Checkout exact engine source for parity assertions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tomas-rampas/vouchfx
          ref: ${{ steps.pin.outputs.commit }}
          path: engine-source
          persist-credentials: false
      - name: Verify source identity and Docker prerequisite
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C engine-source rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"
          docker info --format '{{.OSType}}' | tee "$RUNNER_TEMP/vouchfx-docker-os.txt"
          test "$(cat "$RUNNER_TEMP/vouchfx-docker-os.txt")" = linux
      - name: Configure isolated SDK and apphost roots
        shell: bash
        run: |
          printf 'DOTNET_INSTALL_DIR=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'DOTNET_ROOT_X64=%s/dotnet-compatibility\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Set up selected .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "${{ inputs.dotnet_sdk }}.x"

      - name: Test runtime-isolation guard safety
        shell: pwsh
        run: ./scripts/ci/test-select-dotnet-runtime.ps1
      - name: Keep only the selected SDK and shared frameworks
        env:
          EXPECTED_DOTNET: '${{ inputs.dotnet_sdk }}'
        shell: pwsh
        run: ./scripts/ci/select-dotnet-runtime.ps1 -ExpectedDotnet $env:EXPECTED_DOTNET
      - name: Require the selected SDK and runtime only
        env:
          EXPECTED_DOTNET: ${{ inputs.dotnet_sdk }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_DOTNET" =~ ^(8|9|10)\.0$ ]]
          [[ "$(dotnet --version)" == "$EXPECTED_DOTNET".* ]]
          runtimes="$(dotnet --list-runtimes)"
          printf '%s\n' "$runtimes"
          [[ "$runtimes" == *Microsoft.NETCore.App* ]]
          [[ "$runtimes" == *Microsoft.AspNetCore.App* ]]
          while read -r _framework version _location; do
            [[ "$version" == "$EXPECTED_DOTNET".* ]]
          done <<< "$runtimes"
      - name: Restore and build MCP tests
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore Vouchfx.Mcp.sln --locked-mode
          dotnet build Vouchfx.Mcp.sln -c Release --no-restore -warnaserror
      - name: Install and verify the public CLI with its bundled DCP
        shell: bash
        env:
          EXPECTED_DOTNET: ${{ inputs.dotnet_sdk }}
        run: |
          set -euo pipefail
          config="$RUNNER_TEMP/vouchfx-public-only.NuGet.Config"
          printf '%s\n' '<configuration><packageSources><clear /><add key="nuget.org" value="https://api.nuget.org/v3/index.json" /></packageSources></configuration>' > "$config"
          tool_path="$RUNNER_TEMP/vouchfx-public-cli"
          # The immutable public pin predates runtime roll-forward. Exercise
          # that exact binary on 9/10 using the SDK's explicit install opt-in;
          # never rewrite its files or claim its original policy changed.
          roll_forward=()
          if [[ "$EXPECTED_DOTNET" != 8.0 ]]; then
            roll_forward=(--allow-roll-forward)
          fi
          dotnet tool install vouchfx --tool-path "$tool_path" --version "${{ steps.pin.outputs.version }}" \
            --configfile "$config" "${roll_forward[@]}"
          test "$("$tool_path/vouchfx" --version)" = "${{ steps.pin.outputs.version }}+${{ steps.pin.outputs.commit }}"
          # Inspect the normal bundled Linux payload; do not select an alternate DCP.
          bundled_dcp=("$tool_path"/.store/vouchfx/${{ steps.pin.outputs.version }}/vouchfx/${{ steps.pin.outputs.version }}/tools/net8.0/any/dcp/*/linux-x64/tools/dcp)
          test "${#bundled_dcp[@]}" -eq 1
          test -f "${bundled_dcp[0]}"
          # Normal topology startup restores NuGet native execute bits.
          printf '%s\n' "$tool_path" >> "$GITHUB_PATH"
      - name: Verify required-probe assertion contract
        run: python3 -B -m unittest discover -s scripts/tests -p test_assert_required_real_probes.py -v
      - name: Run exactly six required methods and verify real execution
        shell: bash
        env:
          VOUCHFX_MCP_REQUIRED_REAL_PROBES: "1"
          VOUCHFX_MCP_REQUIRED_LINK_PROBES: "1"
          VOUCHFX_ENGINE_REPO: ${{ github.workspace }}/engine-source
        run: |
          set -euo pipefail
          mkdir -p required-real-probe-results
          filter='FullyQualifiedName=Vouchfx.Mcp.Tests.RealEnvRefusalAgainstPinnedCliTests.DependencyEnvRefusal_AgainstPinnedInstalledCli_StillPrintsTheSignature_AndStillOmitsTheValue|FullyQualifiedName=Vouchfx.Mcp.Tests.RealReservedEnvironmentAgainstPinnedCliTests.CompleteEngineOwnedTable_AndEveryTypeKeyRefusal_AgreeWithThePinnedCli|FullyQualifiedName=Vouchfx.Mcp.Tests.RealStepAttemptEnvelopeAgainstPinnedCliTests.StepAttemptEvents_FromARealPinnedEngineRun_CarryTheEnvelopeThisServersDocumentationClaims|FullyQualifiedName=Vouchfx.Mcp.Tests.RealStepAttemptEnvelopeAgainstPinnedCliTests.AnImmediateStep_EmitsNoAttemptEvent_SoItsTimelineIsEmptyAndItsVerifyModeNull|FullyQualifiedName=Vouchfx.Mcp.Tests.RealScaffoldSuiteAgainstPinnedCliTests.StorageScaffold_AgainstPinnedInstalledCli_EmitsS3AndPassesFullValidation|FullyQualifiedName=Vouchfx.Mcp.Tests.RealScaffoldSuiteAgainstPinnedCliTests.StorageScaffold_WithExplicitS3Outline_AgainstPinnedInstalledCli_PassesFullValidation'
          dotnet test tests/Vouchfx.Mcp.Tests/Vouchfx.Mcp.Tests.csproj -c Release --no-build --filter "$filter" --results-directory required-real-probe-results --logger 'trx;LogFileName=required-real-probes.trx' --logger 'console;verbosity=detailed' 2>&1 | tee required-real-probe-results/console.log
          python3 scripts/assert-required-real-probes.py required-real-probe-results/required-real-probes.trx required-real-probe-results/console.log
          # Verify the shipped CLI restored its own bundled executable permissions.
          tool_path="$RUNNER_TEMP/vouchfx-public-cli"
          bundled_dcp=("$tool_path"/.store/vouchfx/${{ steps.pin.outputs.version }}/vouchfx/${{ steps.pin.outputs.version }}/tools/net8.0/any/dcp/*/linux-x64/tools/dcp)
          test "${#bundled_dcp[@]}" -eq 1
          test -x "${bundled_dcp[0]}"
      - name: Upload raw required-probe diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: required-real-probe-results${{ inputs.dotnet_sdk != '8.0' && format('-net{0}', inputs.dotnet_sdk) || '' }}
          path: required-real-probe-results/
          if-no-files-found: warn
