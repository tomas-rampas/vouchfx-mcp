# .github/workflows/build.yml — vouchfx-mcp CI pipeline
#
# Three independent jobs (no `needs:` between them — they run in parallel):
#
#   - build: restore → build (0-warning, -warnaserror) → format → install the
#     pinned `vouchfx` CLI (parsed from ENGINE_PIN, never hard-coded) → assert
#     the installed CLI's --version matches ENGINE_PIN field-for-field → unit
#     tests. The install+assert pair (vouchfx-mcp#40) is what makes FOUR of the
#     five `*AgainstPinnedCliTests` parity tests — RealGetSchemaAgainstPinnedCliTests,
#     RealValidateAgainstPinnedCliTests, RealListStepTypesAgainstPinnedCliTests,
#     RealPlanCoverageAgainstPinnedCliTests — actually run here instead of silently
#     taking their self-gated quiet-pass branch: those tests skip when no installed
#     CLI matches ENGINE_PIN (gated on the same CliPinVerifier this pair asserts
#     against), so a green assert step is the mechanical proof those four oracles
#     really executed. The fifth, RealStepAttemptEnvelopeAgainstPinnedCliTests, has a
#     SECOND, independent gate this pipeline does not assert: a container runtime,
#     because it is the only one of the five that runs a real suite end to end.
#     ubuntu-latest ships Docker, but nothing here confirms a container actually ran —
#     that gate stays unasserted, so this test's guarantees remain host-conditional
#     exactly as ENGINE_PIN's CAVEAT paragraph and CLAUDE.md's testing-conventions
#     bullet describe. This repo has no Docker-dependent integration surface of its
#     own (the MCP server wraps the packaged `vouchfx` CLI as a subprocess; no Aspire
#     topology of its own), so — unlike the engine repo — there is no separate
#     `integration` job.
#
#   - vendored-drift: runs scripts/sync-vendored.ps1 -Verify, the mechanical
#     gate for vendored/ (see vendored/README.md) — it re-downloads the three
#     engine artefacts at the exact commit ENGINE_PIN records and byte-compares
#     them against what is committed, failing the build on any drift, missing
#     file, or download error. Kept separate from `build` because it exercises
#     none of the .NET toolchain and needs network egress to
#     raw.githubusercontent.com that the build job has no reason to need.
#
#   - pack: `dotnet pack -c Release` of the single Vouchfx.Mcp dotnet-tool
#     project on every push/PR, PLUS a content-level validation of the nupkg it
#     produces — the packaging-metadata equivalent of a compile gate. A broken
#     PackageId/PackAsTool/PackageReadmeFile property, or a change to the
#     ENGINE_PIN Content item that stops it flowing into the packed tool
#     directory, fails HERE rather than being discovered at release time (see
#     .github/workflows/release.yml, which does the real, tag-versioned pack
#     that this job's steps deliberately mirror at a smaller scale). Installing
#     a global tool is deliberately NOT done in THIS job (heavy, and this job's
#     own check is unzip-and-inspect, not a live CLI handshake) — CI as a whole
#     does now install the pinned CLI, but in the `build` job, where it is
#     needed for the `*AgainstPinnedCliTests` parity tests (vouchfx-mcp#40).

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same ref to avoid wasting runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token: checkout needs contents: read and nothing
# else here touches the GITHUB_TOKEN.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    # TEMPORARY for the measurement commit: raised from 20 to 35 to give the
    # added detailed-verbosity *AgainstPinnedCliTests run room in case the
    # envelope probe's Docker containers genuinely run (2x6min RunBudgets
    # would apply). Reverted alongside the measurement step once the answer
    # is known.
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # OpenSSF hardening: the job token is already read-only (permissions:
          # contents: read above); this removes the persisted git credential
          # entirely so no step can push/authenticate as the token even by
          # accident.
          persist-credentials: false

      # Install the .NET 8 SDK. The version spec "8.0.x" satisfies global.json
      # (sdk.version = "8.0.400", rollForward = latestFeature).
      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore Vouchfx.Mcp.sln

      # Directory.Build.props sets TreatWarningsAsErrors=true; -warnaserror is
      # belt-and-braces so a warning fails the build even if that property is
      # ever removed from a project file.
      - name: Build (Release, 0-warning gate)
        run: dotnet build Vouchfx.Mcp.sln -c Release --no-restore -warnaserror

      # Format gate: dotnet format re-runs the formatter and errors if any file
      # would change — catches whitespace drift, import ordering, and any
      # EditorConfig rule the formatter enforces.
      - name: Format gate (dotnet format --verify-no-changes)
        run: dotnet format Vouchfx.Mcp.sln --verify-no-changes --no-restore

      # Install the pinned vouchfx CLI so four of the five *AgainstPinnedCliTests
      # parity tests (RealGetSchemaAgainstPinnedCliTests, RealValidateAgainstPinnedCliTests,
      # RealListStepTypesAgainstPinnedCliTests, RealPlanCoverageAgainstPinnedCliTests)
      # stop self-gating into their silent quiet-pass branch (vouchfx-mcp#40). The
      # version is PARSED from ENGINE_PIN's first line, never hard-coded — a
      # hard-coded value would itself drift from the pin it exists to verify,
      # which is the bug this step fixes. `~/.dotnet/tools` is on PATH on
      # ubuntu-latest by default, so no separate PATH step is needed. The
      # explicit --add-source pins the feed rather than relying on whatever
      # NuGet.config a runner image or repo happens to carry. (`dotnet tool
      # install`/`update` name this flag --add-source, not --source — the
      # latter belongs to `dotnet nuget push`; MEASURED on this PR's first CI
      # attempt, which failed with "Unrecognized command or argument
      # '--source'" on both the update and the install fallback.)
      #
      # `dotnet tool update` first, falling back to `dotnet tool install`, rather
      # than a bare `install`: MEASURED (dotnet/sdk#9282), `dotnet tool update`
      # on a tool that is not yet installed fails outright with "is not
      # currently installed" — it does NOT install-if-absent, so a bare `update`
      # would break every ubuntu-latest run (fresh VM, nothing pre-installed).
      # The try-update-else-install pattern below is what actually delivers
      # idempotency (a warm/self-hosted runner that already carries the tool
      # updates in place instead of erroring on "already installed") without
      # breaking the common fresh-runner case that `update` alone cannot handle.
      - name: Install pinned vouchfx CLI
        run: |
          set -euo pipefail
          read -r ver sha < ENGINE_PIN
          echo "ENGINE_PIN: version=$ver sha=$sha"
          # NuGet package versions carry no leading "v" (ENGINE_PIN's version
          # field does, e.g. "v1.0.0-rc.5" -> "1.0.0-rc.5").
          nuget_version="${ver#v}"
          source_url="https://api.nuget.org/v3/index.json"
          if ! dotnet tool update --global vouchfx --version "$nuget_version" --add-source "$source_url"; then
            echo "vouchfx not yet installed on this runner — installing fresh."
            dotnet tool install --global vouchfx --version "$nuget_version" --add-source "$source_url"
          fi

      # Mechanical proof that the parity tests' quiet-pass branch is
      # unreachable: `vouchfx --version` on a pinned build prints
      # "<version-without-v>+<commit-sha>" (documented in ENGINE_PIN's own
      # comment block). This step fails the job BEFORE the test step runs if
      # the installed CLI does not match ENGINE_PIN field-for-field, rather
      # than letting a silent version mismatch make every parity test skip.
      # Asserting the FULL informational version (core version AND the
      # "+<commit-sha>" build metadata) is DELIBERATELY STRICTER than
      # CliPinVerifier itself, which the parity tests actually gate on and
      # which compares only the core version — see CliPinVerifier's own
      # remarks. The stronger check here buys commit-level verification for
      # free (a version match with a different embedded commit would
      # otherwise pass CI silently), at the cost of coupling this step to the
      # engine's packaging continuing to embed the commit SHA in --version
      # output. The two mismatch shapes are distinguished so the error names
      # the right consequence: a CORE version mismatch means the parity tests
      # would skip entirely (CliPinVerifier itself would refuse); a build-
      # metadata-only mismatch means they would still run, but against an
      # engine build ENGINE_PIN does not name.
      - name: Assert installed CLI matches ENGINE_PIN
        run: |
          set -euo pipefail
          read -r ver sha < ENGINE_PIN
          expected_version="${ver#v}"
          expected="${expected_version}+${sha}"
          actual="$(vouchfx --version)"
          echo "Expected: $expected"
          echo "Actual:   $actual"
          if [ "$actual" = "$expected" ]; then
            echo "OK: installed vouchfx CLI matches ENGINE_PIN exactly."
            exit 0
          fi
          actual_core="${actual%%+*}"
          if [ "$actual_core" != "$expected_version" ]; then
            echo "::error::Installed vouchfx CLI version '$actual' does not match ENGINE_PIN's core version '$expected_version' — the *AgainstPinnedCliTests parity tests would silently skip rather than run."
          else
            echo "::error::Installed vouchfx CLI version '$actual' matches ENGINE_PIN's core version but not its build metadata (expected '$expected') — the *AgainstPinnedCliTests parity tests would run, but against an engine build ENGINE_PIN does not name."
          fi
          exit 1

      - name: Unit tests
        run: dotnet test Vouchfx.Mcp.sln -c Release --no-build

      # TEMPORARY measurement step (to be reverted): re-runs just the five
      # *AgainstPinnedCliTests classes at detailed verbosity so the report can
      # quote, verbatim, whether each prints real comparison/probe output or
      # its "SKIPPED (not a failure)" line, and where RealStepAttemptEnvelope
      # AgainstPinnedCliTests specifically bails (or whether it genuinely runs
      # containers, with timings). This is a one-off measurement commit, not
      # a permanent CI step — a second full test pass on every push is not
      # something this pipeline wants to keep.
      - name: MEASURE — detailed AgainstPinnedCli test output
        run: |
          dotnet test Vouchfx.Mcp.sln -c Release --no-build \
            --filter "FullyQualifiedName~AgainstPinnedCli" \
            --logger "console;verbosity=detailed"

  vendored-drift:
    name: Vendored artefact drift gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ubuntu-latest GitHub-hosted runners ship pwsh (PowerShell 7) in the
      # default toolset, so no separate setup step is needed. -Verify is the
      # script's default mode; passed explicitly here for readability.
      - name: Verify vendored/ matches ENGINE_PIN
        shell: pwsh
        run: ./scripts/sync-vendored.ps1 -Verify

  pack:
    name: Pack (dotnet tool) & validate nupkg contents
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore src/Vouchfx.Mcp/Vouchfx.Mcp.csproj

      # No -p:PackageVersion here on purpose: the csproj's own conditional default
      # (0.1.0-alpha.1) is exactly what a bare local `dotnet pack` produces, and this job
      # exists to catch a packaging-metadata regression, not to mint a release artefact —
      # release.yml is the only workflow that supplies a tag-derived -p:PackageVersion.
      - name: Pack Vouchfx.Mcp (Release, 0-warning gate)
        run: |
          dotnet pack src/Vouchfx.Mcp/Vouchfx.Mcp.csproj \
            -c Release \
            -warnaserror \
            -o artifacts/nuget

      # Content-level validation: unzip the nupkg the previous step just produced and
      # check the three things that would otherwise only surface when someone actually
      # tries to install and run the tool.
      #   1. It is really a dotnet-tool package naming the `vouchfx-mcp` command
      #      (DotnetToolSettings.xml), not just an ordinary library nupkg.
      #   2. ENGINE_PIN — the one loose (non-embedded) file EnginePin.Load depends on at
      #      startup via AppContext.BaseDirectory — actually ships in the same
      #      tools/<tfm>/any/ directory as the entry DLL. A globally-installed tool's
      #      BaseDirectory is the tool's own store directory, not a source checkout, so a
      #      missing ENGINE_PIN here means every real install fails the MCP handshake
      #      fatally at startup — exactly the failure mode REQ-011 exists to prevent.
      #   3. The entry assembly itself is present (a coarse check that publish actually
      #      populated the tool directory rather than packing an empty skeleton).
      # Embedded vendored resources (composed-schema/language-reference/recipes) are
      # deliberately NOT re-checked here — they are compiled into Vouchfx.Mcp.dll itself
      # (see the EmbeddedResource items in the csproj), not loose content, and their
      # readability at runtime is already covered by VendoredArtefactsTests in the `build`
      # job above; unzip-only inspection of a DLL's manifest resources would need extra
      # tooling this job has no other reason to install.
      - name: Validate packed nupkg (tool manifest, ENGINE_PIN, entry assembly)
        run: |
          set -euo pipefail
          nupkg=$(ls artifacts/nuget/Vouchfx.Mcp.*.nupkg)
          echo "Inspecting: $nupkg"
          extract_dir="$RUNNER_TEMP/nupkg-inspect"
          mkdir -p "$extract_dir"
          unzip -q -o "$nupkg" -d "$extract_dir"

          tool_dir="$extract_dir/tools/net8.0/any"

          manifest="$tool_dir/DotnetToolSettings.xml"
          if [ ! -f "$manifest" ]; then
            echo "::error::DotnetToolSettings.xml not found under tools/net8.0/any/ — this nupkg is not a dotnet-tool package."
            exit 1
          fi
          if ! grep -q 'Name="vouchfx-mcp"' "$manifest"; then
            echo "::error::DotnetToolSettings.xml does not name the 'vouchfx-mcp' command:"
            cat "$manifest"
            exit 1
          fi
          echo "OK: tool manifest names the vouchfx-mcp command."

          if [ ! -f "$tool_dir/ENGINE_PIN" ]; then
            echo "::error::ENGINE_PIN is missing from tools/net8.0/any/ — a globally-installed tool would fail EnginePin.Load (Program.cs) at startup and never serve MCP requests. Check the Content item in Vouchfx.Mcp.csproj."
            find "$extract_dir/tools" -maxdepth 3
            exit 1
          fi
          echo "OK: ENGINE_PIN is present alongside the entry assembly."

          if [ ! -f "$tool_dir/Vouchfx.Mcp.dll" ]; then
            echo "::error::Vouchfx.Mcp.dll is missing from tools/net8.0/any/ — the publish step did not populate the tool directory."
            exit 1
          fi
          echo "OK: entry assembly (Vouchfx.Mcp.dll) is present."

          echo "Packed nupkg content validation passed."
