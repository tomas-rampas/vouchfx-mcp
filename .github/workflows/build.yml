# .github/workflows/build.yml — vouchfx-mcp CI pipeline
#
# Three independent jobs (no `needs:` between them — they run in parallel):
#
#   - build: locked-mode restore (issue #79 — packages.lock.json must exactly match, or
#     the step fails NU1004; see the restore step's own comment for the remedy) → build
#     (0-warning, -warnaserror) → format → install the
#     pinned `vouchfx` CLI (parsed from ENGINE_PIN, never hard-coded) → assert
#     the installed CLI's --version matches ENGINE_PIN field-for-field → unit
#     tests. The install+assert pair (vouchfx-mcp#40) is what makes FOUR of the
#     five `*AgainstPinnedCliTests` parity tests — RealGetSchemaAgainstPinnedCliTests,
#     RealValidateAgainstPinnedCliTests, RealListStepTypesAgainstPinnedCliTests,
#     RealPlanCoverageAgainstPinnedCliTests — actually run here instead of silently
#     taking their self-gated quiet-pass branch: those tests skip when no installed
#     CLI matches ENGINE_PIN (gated on the same CliPinVerifier this pair asserts
#     against), so a green assert step is the mechanical proof those four oracles
#     really executed. MEASURED, not inferred, on PR #100 (run
#     https://github.com/tomas-rampas/vouchfx-mcp/actions/runs/34756438822, a one-off
#     detailed-verbosity re-run of just these five classes): all four printed genuine
#     comparison output against the live pinned binary rather than a SKIPPED line — see
#     ENGINE_PIN's CAVEAT paragraph for the verbatim excerpts. The CliPinVerifier gate is
#     not the ONLY silent-skip path those four classes hold, though: that same run also
#     showed an unrelated, pre-existing self-gate — one RealValidateAgainstPinnedCliTests
#     corpus-comparison case skips when a sibling vouchfx engine checkout is absent, which
#     CI does not carry — and in principle a CliPinVerifier-level Unparseable or transient
#     probe failure inside the test process (distinct from the version mismatch this
#     pipeline's assert step catches) could silently skip one of these tests without
#     failing CI; neither is exercised by this pin today. The fifth,
#     RealStepAttemptEnvelopeAgainstPinnedCliTests, has a SECOND, independent gate this
#     pipeline does not assert: a container runtime, because it is the only one of the
#     five that runs a real suite end to end. MEASURED on that same run: both its test
#     methods SKIPPED in under 800ms, before Docker was ever reached — the probe's
#     `RunSuiteAsync` failed with "topology failed to start" because the Aspire DCP
#     orchestration component the vouchfx tool depends on is not present on this runner
#     image (see ENGINE_PIN's CAVEAT paragraph for the full excerpt; tracked as
#     vouchfx-mcp#102). ubuntu-latest shipping Docker was never what this test needed
#     next — that gate stays unasserted, so this test's guarantees remain host-conditional
#     exactly as ENGINE_PIN's CAVEAT paragraph and CLAUDE.md's testing-conventions bullet
#     describe. This repo has no
#     Docker-dependent integration surface of its own (the MCP server wraps the packaged
#     `vouchfx` CLI as a subprocess; no Aspire topology of its own), so — unlike the
#     engine repo — there is no separate `integration` job.
#
#   - vendored-drift: runs scripts/sync-vendored.ps1 -Verify, the mechanical
#     gate for vendored/ (see vendored/README.md) — it re-downloads the three
#     engine artefacts at the exact commit ENGINE_PIN records and byte-compares
#     them against what is committed, failing the build on any drift, missing
#     file, or download error. Kept separate from `build` because it exercises
#     none of the .NET toolchain and needs network egress to
#     raw.githubusercontent.com that the build job has no reason to need.
#
#   - pack: `dotnet pack -c Release` of the single Vouchfx.Mcp dotnet-tool
#     project on every push/PR, PLUS a content-level validation of the nupkg it
#     produces — the packaging-metadata equivalent of a compile gate. A broken
#     PackageId/PackAsTool/PackageReadmeFile property, or a change to the
#     ENGINE_PIN Content item that stops it flowing into the packed tool
#     directory, fails HERE rather than being discovered at release time (see
#     .github/workflows/release.yml, which does the real, tag-versioned pack
#     that this job's steps deliberately mirror at a smaller scale). Installing
#     a global tool is deliberately NOT done in THIS job (heavy, and this job's
#     own check is unzip-and-inspect, not a live CLI handshake) — CI as a whole
#     does now install the pinned CLI, but in the `build` job, where it is
#     needed for the `*AgainstPinnedCliTests` parity tests (vouchfx-mcp#40).

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Cancel in-progress runs for the same ref to avoid wasting runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default token: checkout needs contents: read and nothing
# else here touches the GITHUB_TOKEN.
permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  build:
    name: Build & unit tests
    runs-on: ubuntu-latest
    # 20 minutes sized against the real worst case, not the measured common
    # case: RealStepAttemptEnvelopeAgainstPinnedCliTests defines
    # RunBudget = TimeSpan.FromMinutes(6) and uses it as each of its two test
    # methods' CancellationTokenSource timeout, so if a container runtime
    # were ever reachable here, those two tests could together occupy up to
    # ~12 minutes before self-timing out. Add the ~3-minute measured baseline
    # for everything else and the worst case is ~15 minutes against this
    # 20-minute cap — ~5 minutes of headroom. Baseline breakdown, MEASURED on
    # run https://github.com/tomas-rampas/vouchfx-mcp/actions/runs/34755765875
    # (PR #100): install-CLI step 7s, assert-CLI step <1s, unit-tests step
    # 79s, job total 2m43s (the rest is checkout/restore/build/format). TODAY
    # that 12-minute worst case is not reached: MEASURED (run 34756438822),
    # both envelope tests SKIP in under 800ms via an Aspire DCP gate, well
    # before either RunBudget could be spent — see this file's header comment.
    # 20 minutes is set for the worst case anyway, since fixing the DCP gap
    # (tracked as vouchfx-mcp#102) is exactly the kind of change that could
    # silently make this job start spending that budget.
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # OpenSSF hardening: the job token is already read-only (permissions:
          # contents: read above); this removes the persisted git credential
          # entirely so no step can push/authenticate as the token even by
          # accident.
          persist-credentials: false

      # Install the .NET 8 SDK. The version spec "8.0.x" satisfies global.json
      # (sdk.version = "8.0.400", rollForward = latestFeature).
      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      # Locked restore (issue #79): RestorePackagesWithLockFile=true
      # (Directory.Build.props) makes restore produce/consume packages.lock.json per
      # project; --locked-mode makes THIS restore fail with NU1004 rather than silently
      # re-resolving if the committed lock file does not exactly match what restore would
      # otherwise resolve — a version drift (transitive included), or a lock file that is
      # stale against the csproj files. Locked mode is CI-only, applied at this call site
      # rather than in Directory.Build.props, so local dev restores stay unlocked and an
      # intentional package bump regenerates the lock file with a plain `dotnet restore`.
      # On NU1004: rerun `dotnet restore Vouchfx.Mcp.sln` locally (no --locked-mode) and
      # commit the updated packages.lock.json file(s).
      #
      # NU1004 does NOT catch a MISSING lock file, and this restore step alone does not
      # either — MEASURED (SDK 8.0.424, matching global.json's 8.0.400 floor): --locked-mode
      # against a project with no committed packages.lock.json exits 0 and silently CREATES
      # one, rather than refusing. A fifth project added without ever running an unlocked
      # `dotnet restore` and committing the result would restore "successfully" here while
      # shipping an unpinned transitive closure. That hole is closed by
      # LockFileCoverageSourceGuardTests (tests/Vouchfx.Mcp.Tests), which asserts every
      # tracked .csproj has a tracked sibling packages.lock.json and runs as part of the
      # Unit tests step below — not by this restore step.
      - name: Restore dependencies (locked mode)
        run: dotnet restore Vouchfx.Mcp.sln --locked-mode

      # Directory.Build.props sets TreatWarningsAsErrors=true; -warnaserror is
      # belt-and-braces so a warning fails the build even if that property is
      # ever removed from a project file.
      - name: Build (Release, 0-warning gate)
        run: dotnet build Vouchfx.Mcp.sln -c Release --no-restore -warnaserror

      # Format gate: dotnet format re-runs the formatter and errors if any file
      # would change — catches whitespace drift, import ordering, and any
      # EditorConfig rule the formatter enforces.
      - name: Format gate (dotnet format --verify-no-changes)
        run: dotnet format Vouchfx.Mcp.sln --verify-no-changes --no-restore

      # Install the pinned vouchfx CLI so four of the five *AgainstPinnedCliTests
      # parity tests (RealGetSchemaAgainstPinnedCliTests, RealValidateAgainstPinnedCliTests,
      # RealListStepTypesAgainstPinnedCliTests, RealPlanCoverageAgainstPinnedCliTests)
      # stop self-gating into their silent quiet-pass branch (vouchfx-mcp#40). The
      # version is PARSED from ENGINE_PIN's first line, never hard-coded — a
      # hard-coded value would itself drift from the pin it exists to verify,
      # which is the bug this step fixes. `~/.dotnet/tools` is on PATH on
      # ubuntu-latest by default, so no separate PATH step is needed. The
      # explicit --add-source ADDS nuget.org to whatever sources are already
      # configured (it does not replace or pin them) — it guarantees nuget.org
      # is among the sources searched regardless of what NuGet.config a runner
      # image or this repo happens to carry, without excluding any other
      # configured source. (`dotnet tool install`/`update` name this flag
      # --add-source, not --source — the latter belongs to `dotnet nuget
      # push`; MEASURED on SDK 8.0.425/this PR's first CI attempt, which
      # failed with "Unrecognized command or argument '--source'" on both the
      # update and the install fallback.) --add-source guarantees nuget.org is
      # among the sources but does not restrict resolution to it; with no
      # NuGet.config in this repo, the effective source set on a hosted
      # runner is nuget.org alone in practice, so a pinned --configfile was
      # judged disproportionate — this step's job is to reach the right
      # PACKAGE, and the assert step below is the drift gate that catches a
      # wrong one; it is not an authenticity/supply-chain gate.
      #
      # `dotnet tool update` first, falling back to `dotnet tool install`:
      # MEASURED on SDK 8.0.425 (run
      # https://github.com/tomas-rampas/vouchfx-mcp/actions/runs/34755765875),
      # `dotnet tool update` on a tool that is NOT yet installed on this
      # runner actually DOES install it — the fallback's own diagnostic echo
      # never printed, and the tool's success message came from the `update`
      # invocation itself. The `install` fallback is kept anyway as defence-
      # in-depth: this install-if-absent behaviour is undocumented and has
      # varied across SDK versions (see dotnet/sdk#9282, which reports the
      # opposite outcome on an unspecified earlier SDK) — the fallback costs
      # nothing when unreached and protects against a future SDK reverting to
      # the documented "fails outright" behaviour.
      - name: Install pinned vouchfx CLI
        run: |
          set -euo pipefail
          read -r ver sha < ENGINE_PIN
          echo "ENGINE_PIN: version=$ver sha=$sha"
          # NuGet package versions carry no leading "v" (ENGINE_PIN's version
          # field does, e.g. "v1.0.0-rc.5" -> "1.0.0-rc.5").
          nuget_version="${ver#v}"
          source_url="https://api.nuget.org/v3/index.json"
          if ! dotnet tool update --global vouchfx --version "$nuget_version" --add-source "$source_url"; then
            echo "vouchfx not yet installed on this runner — installing fresh."
            dotnet tool install --global vouchfx --version "$nuget_version" --add-source "$source_url"
          fi

      # Mechanical proof that the parity tests' quiet-pass branch is
      # unreachable: `vouchfx --version` on a pinned build prints
      # "<version-without-v>+<commit-sha>" (documented in ENGINE_PIN's own
      # comment block). This step fails the job BEFORE the test step runs if
      # the installed CLI does not match ENGINE_PIN field-for-field, rather
      # than letting a silent version mismatch make every parity test skip.
      # Asserting the FULL informational version (core version AND the
      # "+<commit-sha>" build metadata) is DELIBERATELY STRICTER than
      # CliPinVerifier itself, which the parity tests actually gate on and
      # which compares only the core version — see CliPinVerifier's own
      # remarks. The stronger check here buys commit-level verification for
      # free (a version match with a different embedded commit would
      # otherwise pass CI silently), at the cost of coupling this step to the
      # engine's packaging continuing to embed the commit SHA in --version
      # output. THREE failure shapes are distinguished so the error names the
      # right consequence: a CORE version mismatch means the parity tests
      # would skip entirely (CliPinVerifier itself would refuse); a build-
      # metadata-only mismatch means they would still run, but against an
      # engine build ENGINE_PIN does not name; and the probe itself failing to
      # run at all (not on PATH — exit 127, a corrupt install, or a
      # permissions problem) is named explicitly rather than left to
      # `set -e`'s bare, undiagnosed abort.
      - name: Assert installed CLI matches ENGINE_PIN
        run: |
          set -euo pipefail
          read -r ver sha < ENGINE_PIN
          expected_version="${ver#v}"
          expected="${expected_version}+${sha}"
          actual="$(vouchfx --version)" || { echo "::error::vouchfx --version could not be run (not on PATH, corrupt install, or permissions)."; exit 1; }
          echo "Expected: $expected"
          echo "Actual:   $actual"
          if [ "$actual" = "$expected" ]; then
            echo "OK: installed vouchfx CLI matches ENGINE_PIN exactly."
            exit 0
          fi
          actual_core="${actual%%+*}"
          if [ "$actual_core" != "$expected_version" ]; then
            echo "::error::Installed vouchfx CLI version '$actual' does not match ENGINE_PIN's core version '$expected_version' — the *AgainstPinnedCliTests parity tests would silently skip rather than run."
          else
            echo "::error::Installed vouchfx CLI version '$actual' matches ENGINE_PIN's core version but not its build metadata (expected '$expected') — the *AgainstPinnedCliTests parity tests would run, but against an engine build ENGINE_PIN does not name."
          fi
          exit 1

      - name: Unit tests
        run: dotnet test Vouchfx.Mcp.sln -c Release --no-build

  vendored-drift:
    name: Vendored artefact drift gate
    runs-on: ubuntu-latest
    # Measured (this PR's CI runs): 7-12s wall — one checkout plus one script
    # invocation with no .NET toolchain and no test host to start. 10 minutes
    # is a wide multiple, generous enough for a slow raw.githubusercontent.com
    # fetch while still catching a genuinely wedged download.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ubuntu-latest GitHub-hosted runners ship pwsh (PowerShell 7) in the
      # default toolset, so no separate setup step is needed. -Verify is the
      # script's default mode; passed explicitly here for readability.
      - name: Verify vendored/ matches ENGINE_PIN
        shell: pwsh
        run: ./scripts/sync-vendored.ps1 -Verify

  pack:
    name: Pack (dotnet tool) & validate nupkg contents
    runs-on: ubuntu-latest
    # Measured (this PR's CI runs): 22-28s wall for restore + pack + unzip-
    # and-inspect, no test host involved. 10 minutes is a wide multiple.
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      # Locked restore (issue #79) — same rationale and remedy as the `build` job's restore
      # step above: --locked-mode fails with NU1004 on any drift from the committed
      # packages.lock.json (this project's own, since this job restores only
      # src/Vouchfx.Mcp/Vouchfx.Mcp.csproj) rather than silently re-resolving. On NU1004:
      # rerun `dotnet restore Vouchfx.Mcp.sln` locally (no --locked-mode) and commit the
      # updated lock file(s).
      - name: Restore dependencies (locked mode)
        run: dotnet restore src/Vouchfx.Mcp/Vouchfx.Mcp.csproj --locked-mode

      # No -p:PackageVersion here on purpose: the csproj's own conditional default
      # (0.1.0-alpha.1) is exactly what a bare local `dotnet pack` produces, and this job
      # exists to catch a packaging-metadata regression, not to mint a release artefact —
      # release.yml is the only workflow that supplies a tag-derived -p:PackageVersion.
      # --no-restore (issue #79): `dotnet pack` performs an IMPLICIT restore of its own
      # unless told not to, which would bypass the locked-mode restore step above entirely
      # and quietly re-resolve against nuget.org instead of the committed lock file. Passing
      # it makes "every CI restore in this pipeline is locked" structural rather than
      # incidental — there is no restore left in this job that --locked-mode did not gate.
      - name: Pack Vouchfx.Mcp (Release, 0-warning gate)
        run: |
          dotnet pack src/Vouchfx.Mcp/Vouchfx.Mcp.csproj \
            -c Release \
            -warnaserror \
            --no-restore \
            -o artifacts/nuget

      # Content-level validation: unzip the nupkg the previous step just produced and
      # check the three things that would otherwise only surface when someone actually
      # tries to install and run the tool.
      #   1. It is really a dotnet-tool package naming the `vouchfx-mcp` command
      #      (DotnetToolSettings.xml), not just an ordinary library nupkg.
      #   2. ENGINE_PIN — the one loose (non-embedded) file EnginePin.Load depends on at
      #      startup via AppContext.BaseDirectory — actually ships in the same
      #      tools/<tfm>/any/ directory as the entry DLL. A globally-installed tool's
      #      BaseDirectory is the tool's own store directory, not a source checkout, so a
      #      missing ENGINE_PIN here means every real install fails the MCP handshake
      #      fatally at startup — exactly the failure mode REQ-011 exists to prevent.
      #   3. The entry assembly itself is present (a coarse check that publish actually
      #      populated the tool directory rather than packing an empty skeleton).
      # Embedded vendored resources (composed-schema/language-reference/recipes) are
      # deliberately NOT re-checked here — they are compiled into Vouchfx.Mcp.dll itself
      # (see the EmbeddedResource items in the csproj), not loose content, and their
      # readability at runtime is already covered by VendoredArtefactsTests in the `build`
      # job above; unzip-only inspection of a DLL's manifest resources would need extra
      # tooling this job has no other reason to install.
      - name: Validate packed nupkg (tool manifest, ENGINE_PIN, entry assembly)
        run: |
          set -euo pipefail
          nupkg=$(ls artifacts/nuget/Vouchfx.Mcp.*.nupkg)
          echo "Inspecting: $nupkg"
          extract_dir="$RUNNER_TEMP/nupkg-inspect"
          mkdir -p "$extract_dir"
          unzip -q -o "$nupkg" -d "$extract_dir"

          tool_dir="$extract_dir/tools/net8.0/any"

          manifest="$tool_dir/DotnetToolSettings.xml"
          if [ ! -f "$manifest" ]; then
            echo "::error::DotnetToolSettings.xml not found under tools/net8.0/any/ — this nupkg is not a dotnet-tool package."
            exit 1
          fi
          if ! grep -q 'Name="vouchfx-mcp"' "$manifest"; then
            echo "::error::DotnetToolSettings.xml does not name the 'vouchfx-mcp' command:"
            cat "$manifest"
            exit 1
          fi
          echo "OK: tool manifest names the vouchfx-mcp command."

          if [ ! -f "$tool_dir/ENGINE_PIN" ]; then
            echo "::error::ENGINE_PIN is missing from tools/net8.0/any/ — a globally-installed tool would fail EnginePin.Load (Program.cs) at startup and never serve MCP requests. Check the Content item in Vouchfx.Mcp.csproj."
            find "$extract_dir/tools" -maxdepth 3
            exit 1
          fi
          echo "OK: ENGINE_PIN is present alongside the entry assembly."

          if [ ! -f "$tool_dir/Vouchfx.Mcp.dll" ]; then
            echo "::error::Vouchfx.Mcp.dll is missing from tools/net8.0/any/ — the publish step did not populate the tool directory."
            exit 1
          fi
          echo "OK: entry assembly (Vouchfx.Mcp.dll) is present."

          echo "Packed nupkg content validation passed."
