# .github/workflows/release.yml — vouchfx-mcp NuGet trusted-publishing release pipeline
# =============================================================================
# Mirrors the OIDC trusted-publishing mechanism the vouchfx ENGINE repo's own
# .github/workflows/release.yml uses (see that file's header for the full write-up),
# scaled down to this repo's single package: `Vouchfx.Mcp`, the packaged `vouchfx-mcp`
# dotnet tool. This repo ships no SDK-closure, no self-contained per-OS executables, and
# no installer skeletons, so there is nothing here to mirror beyond the one nupkg.
#
# Triggers
# --------
#   release: [published]     The only publishing event: a GitHub Release is published.
#                              Pushing a tag alone never starts publication.
#   workflow_dispatch          Lets a maintainer smoke-test build/pack without cutting a
#                              real tag. The publish job requires release/published, so a
#                              dispatch run never uploads to a release or publishes to
#                              NuGet.org.
#
# INERT until a release is published or a smoke test is dispatched — no push or
# `pull_request` trigger, so ordinary commits to main and pull requests never invoke it at
# all (build.yml is the push/PR gate; this is the release gate only).
#
# NuGet Trusted Publishing (OIDC, no API key stored as a secret)
# -----------------------------------------------------------------
# Same mechanism as the engine repo: a single-use GitHub OIDC token (permissions:
# id-token: write) is exchanged, via NuGet/login (SHA-pinned, identical version to the
# engine repo's pin), for a short-lived (~1 hour) NuGet.org API key immediately before the
# push. No NUGET_API_KEY — or any other NuGet secret — is stored in this repository at any
# point.
#
# Trusted Publishing policy readiness
#   The exact 'Vouchfx.Mcp' policy was configured and verified ACTIVE on 2026-10-13:
#   Package Owner "Tomas.R", Repository tomas-rampas/vouchfx-mcp (id 1306682545),
#   Workflow File release.yml, no Environment, push new packages/versions, no unlist.
#   Keep that external policy aligned with this workflow's owner, repository and job
#   environment. Policy readiness does not establish package publication or release
#   acceptance. If OIDC login/publish returns 403, verify the matching policy and package
#   scope rather than adding a stored API key. Existing GitHub assets are reused only
#   after exact size/SHA256 agreement, never overwritten. NuGet --skip-duplicate cannot
#   replace a package that is already public;
#   a bad published artifact requires a new patch version.
#
# PACKAGE VERSION vs PROTOCOL VERSION
# -------------------------------------
# The pack step below passes `-p:PackageVersion=$VERSION` (derived from the release tag),
# deliberately NOT `-p:Version=$VERSION`. See the comment beside <PackageVersion> in
# src/Vouchfx.Mcp/Vouchfx.Mcp.csproj: <Version> there is pinned at "0.1.0" as the single
# source of truth for the MCP serverInfo.version reported at the initialize handshake
# (guarded by McpServerSkeletonTests), independent of what NuGet package version is
# published. Overriding PackageVersion (not Version) lets a real tagged release publish
# under its own semver without ever touching that protocol-version contract.
# =============================================================================

name: Release (NuGet trusted publishing)

on:
  release:
    types: [published]
  # Lets a maintainer smoke-test the build/pack steps without cutting a real tag.
  # Release upload and the NuGet publish are ALWAYS skipped on
  # dispatch runs (see the publish job's `if:` condition below).
  workflow_dispatch:
    inputs:
      version:
        description: "Semver string to pack for a smoke test, e.g. 0.0.0-test (no publish)"
        required: true
        default: "0.0.0-test"
        type: string

# Minimum workflow-level permissions; each job declares its own overrides.
permissions:
  contents: read

# Serialize runs per ref; never cancel a publish mid-flight. The published-release
# trigger prevents duplicate tag-push/release publishers; concurrency alone would only queue them.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "true"

jobs:
  required-real-probes:
    name: Required real CLI probes
    uses: ./.github/workflows/required-real-probes.yml


  # ===========================================================================
  # build-pack
  # Builds, tests, and packs the single Vouchfx.Mcp project.
  # ===========================================================================
  build-pack:
    name: Build, test & pack Vouchfx.Mcp (dotnet tool)
    runs-on: ubuntu-latest
    # Same rationale and arithmetic as build.yml's `build` job (worst case:
    # the ~3-minute measured baseline plus the envelope parity test's two
    # 6-minute RunBudgets IF a container runtime were ever reachable here —
    # currently unreached, MEASURED, see that file's header comment) —
    # comfortably above the measured common-case wall time while still
    # catching a genuinely wedged step rather than the default 360-minute cap.
    timeout-minutes: 20
    permissions:
      contents: read

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Required CLI-linked schema tests read the complete corpus at ENGINE_PIN,
      # independently of the separate four-probe job.
      - name: Read exact public engine pin
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          read -r version commit < ENGINE_PIN
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          printf 'version=%s\ncommit=%s\n' "${version#v}" "$commit" >> "$GITHUB_OUTPUT"
      - name: Checkout exact engine source for parity assertions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tomas-rampas/vouchfx
          ref: ${{ steps.pin.outputs.commit }}
          path: engine-source
          persist-credentials: false
      - name: Verify pinned engine source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C engine-source rev-parse HEAD)" = "${{ steps.pin.outputs.commit }}"

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "8.0.x"

      # Locked restore (issue #79): same rationale as build.yml's `build`/`pack` jobs —
      # --locked-mode fails with NU1004 on any drift between the committed
      # packages.lock.json file(s) and what restore would otherwise resolve, rather than
      # silently re-resolving. A release must not be weaker-checked than the PR that
      # preceded it. On NU1004: rerun `dotnet restore Vouchfx.Mcp.sln` locally (no
      # --locked-mode) and commit the updated lock file(s).
      - name: Restore dependencies (locked mode)
        run: dotnet restore Vouchfx.Mcp.sln --locked-mode

      - name: Build (Release, 0-warning gate)
        run: dotnet build Vouchfx.Mcp.sln -c Release --no-restore -warnaserror

      # Install and verify the pinned vouchfx CLI so the *AgainstPinnedCliTests parity
      # tests run for real in this pre-publish gate too, not just in build.yml's PR gate
      # (vouchfx-mcp#40) — a release must not be weaker-checked than the PR that preceded
      # it. Identical run: blocks to build.yml's `build` job steps of the same names so the
      # two can be compared by eye; see that file's comments for the full rationale (parsed-
      # not-hard-coded version, --add-source vs --source, the update-then-install-fallback
      # idempotency measurement, the deliberately-stricter full-informational-version
      # assertion and its three named failure shapes).
      - name: Install pinned vouchfx CLI
        run: |
          set -euo pipefail
          read -r ver sha < ENGINE_PIN
          echo "ENGINE_PIN: version=$ver sha=$sha"
          nuget_version="${ver#v}"
          source_url="https://api.nuget.org/v3/index.json"
          if ! dotnet tool update --global vouchfx --version "$nuget_version" --add-source "$source_url"; then
            echo "vouchfx not yet installed on this runner — installing fresh."
            dotnet tool install --global vouchfx --version "$nuget_version" --add-source "$source_url"
          fi

      - name: Assert installed CLI matches ENGINE_PIN
        run: |
          set -euo pipefail
          read -r ver sha < ENGINE_PIN
          expected_version="${ver#v}"
          expected="${expected_version}+${sha}"
          actual="$(vouchfx --version)" || { echo "::error::vouchfx --version could not be run (not on PATH, corrupt install, or permissions)."; exit 1; }
          echo "Expected: $expected"
          echo "Actual:   $actual"
          if [ "$actual" = "$expected" ]; then
            echo "OK: installed vouchfx CLI matches ENGINE_PIN exactly."
            exit 0
          fi
          actual_core="${actual%%+*}"
          if [ "$actual_core" != "$expected_version" ]; then
            echo "::error::Installed vouchfx CLI version '$actual' does not match ENGINE_PIN's core version '$expected_version' — the *AgainstPinnedCliTests parity tests would silently skip rather than run."
          else
            echo "::error::Installed vouchfx CLI version '$actual' matches ENGINE_PIN's core version but not its build metadata (expected '$expected') — the *AgainstPinnedCliTests parity tests would run, but against an engine build ENGINE_PIN does not name."
          fi
          exit 1

      # Final safety net before anything gets published — this repo's unit tests need no
      # Docker/container topology for the pass/fail/environment-error/inconclusive core
      # (see build.yml's header comment); the CLI install above is what lets the
      # CLI-only parity tests among them run for real rather than self-gate quiet.
      - name: Unit tests
        env:
          VOUCHFX_MCP_REQUIRED_LINK_PROBES: "1"
          VOUCHFX_ENGINE_REPO: ${{ github.workspace }}/engine-source
        run: dotnet test Vouchfx.Mcp.sln -c Release --no-build

      - name: Release asset gate tests
        run: python3 -B -m unittest discover -s scripts/tests -p test_publish_release_asset.py -v

      # Extract semver from the published release tag or nonpublishing dispatch input.
      # release event:      github.event.release.tag_name → "v1.0.0"
      # workflow_dispatch:  inputs.version                → "0.0.0-test"
      - name: Determine release version
        id: version
        # SECURITY: attacker-influenceable context values (tag name, dispatch input) are
        # passed through the env: map and referenced only as quoted shell variables — never
        # interpolated directly inside run: via ${{ }}.
        env:
          EV_TAG: ${{ github.event.release.tag_name }}
          EV_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            tag="$EV_TAG"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="v$EV_INPUT"
          else
            echo "::error::Unsupported release workflow event: $GITHUB_EVENT_NAME"
            exit 1
          fi
          version="${tag#v}"   # strip leading "v" for dotnet -p:PackageVersion
          # Fail-closed: reject anything that is not a valid NuGet version before it
          # reaches $GITHUB_OUTPUT and gets spliced into downstream run: shells (pack/push
          # would otherwise fail later with a far less clear error).
          # Accepted form: x.y.z, or x.y.z-<prerelease> (hyphen-separated only — a DOT
          # before the suffix, e.g. "1.2.3.foo", is neither SemVer nor a valid NuGet
          # version and must be rejected here, not three steps downstream). NuGet does
          # NOT support SemVer "+build" metadata, so a trailing "+..." segment is refused
          # too — the prerelease character class deliberately excludes "+".
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Refusing to release: version '$version' is not a valid NuGet version — expected x.y.z or x.y.z-prerelease (no build metadata)"
            exit 1
          fi
          echo "tag=$tag"         >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Releasing: tag=$tag  version=$version (event: $GITHUB_EVENT_NAME)"

      # Packs Vouchfx.Mcp only — the single package this repo ships.
      # -p:PackageVersion (NOT -p:Version) — see the file header for why.
      # --no-restore (issue #79): the locked-mode restore step above already restored the
      # whole solution, src/Vouchfx.Mcp/Vouchfx.Mcp.csproj included; without --no-restore,
      # `dotnet pack` would perform its own implicit restore that bypasses --locked-mode
      # entirely. Makes "every CI restore in this pipeline is locked" structural.
      - name: Pack nupkg (Vouchfx.Mcp — dotnet tool, primary and only distribution)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet pack src/Vouchfx.Mcp/Vouchfx.Mcp.csproj \
            -c Release \
            -p:PackageVersion="$VERSION" \
            --no-restore \
            -o artifacts/nuget

      - name: Upload nupkg
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuget-package
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error
          retention-days: 30

  # ===========================================================================
  # publish-release
  # Attaches the nupkg to the GitHub Release and publishes it to NuGet.org via
  # Trusted Publishing. Skipped entirely on workflow_dispatch smoke-test runs.
  # ===========================================================================
  publish-release:
    name: Publish to GitHub Release and NuGet.org
    runs-on: ubuntu-latest
    needs: [build-pack, required-real-probes]
    if: github.event_name == 'release' && github.event.action == 'published'
    # No test host and no heavy build here — verify/upload one package asset,
    # exchange an OIDC token and push to NuGet. 15 minutes is a
    # wide multiple over what any of those steps should individually need,
    # generous enough for NuGet.org publish-side slowness while still
    # catching a genuinely wedged step.
    timeout-minutes: 15

    permissions:
      contents: write   # attach files to the already published GitHub Release
      id-token: write   # mint GitHub OIDC token for NuGet Trusted Publishing
      # id-token is necessarily job-scoped (Actions has no step-level permissions), so
      # every step in this job could technically mint an OIDC token; accepted — matches
      # the engine repo's own publish-release job.

    env:
      VERSION: ${{ needs.build-pack.outputs.version }}
      TAG:     ${{ needs.build-pack.outputs.tag }}

    steps:
      - name: Checkout release asset verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download nupkg
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: release-upload/

      # A failed NuGet publication may resume only with an identical existing release asset.
      # The verifier binds the lookup to this event's release ID/repository, never latest.
      - name: Ensure immutable nupkg release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ github.event.release.id }}
        run: |
          set -euo pipefail
          python3 scripts/publish-release-asset.py \
            --package "release-upload/Vouchfx.Mcp.${VERSION}.nupkg" \
            --repository "$GH_REPO" --release-id "$RELEASE_ID" --tag "$TAG"

      # Exchange the single-use GitHub OIDC token for a short-lived (~1 hour), reusable
      # NuGet.org API key via the Trusted Publishing policy configured on nuget.org
      # (Package Owner "Tomas.R") — see policy readiness in the file header. Repository-
      # gated: a fork has no matching policy, so the token exchange would fail there
      # anyway; the explicit condition just fails fast/skips instead of erroring mid-job.
      - name: NuGet login (OIDC → short-lived API key)
        id: nuget-login
        if: ${{ github.repository == 'tomas-rampas/vouchfx-mcp' }}
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: Tomas.R

      # Publish the nupkg to NuGet.org — TRUSTED-PUBLISHING-GATED.
      # Install: dotnet tool install -g Vouchfx.Mcp
      # Package: https://www.nuget.org/packages/Vouchfx.Mcp/
      # --skip-duplicate: a version already live on nuget.org is left untouched — published
      # packages are IMMUTABLE. A bad artifact is never fixed by re-running or re-tagging
      # the same version: ship a new patch version instead.
      - name: Publish nupkg to NuGet.org — Trusted Publishing
        if: ${{ github.repository == 'tomas-rampas/vouchfx-mcp' }}
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push release-upload/*.nupkg \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
