# ─────────────────────────────────────────────────────────────────────────────
# EXAMPLE 3 of 3 — secret references and a message-queue round trip.
#
# Two things worth copying exactly:
#
#   * EVERY credential is a `${secret:...}` REFERENCE, never a literal. The
#     engine resolves it at step-execution time and redacts it from logs, the
#     HTML report and the --events JSON stream; only the reference PATH ever
#     appears anywhere. A literal password in a suite is checked in, printed in
#     CI logs, and flagged by validate_suite as VFX-D-1207.
#
#   * The publish/expect pair is asserted with `verifyMode: RETRY`, because a
#     broker delivering a message is asynchronous by definition.
#
# Served as: vouchfx://examples/secrets-and-messaging
# ─────────────────────────────────────────────────────────────────────────────

metadata:
  name: order-events-published-to-broker
  owner: team-orders
  tags: [integration, messaging, secrets]
  description: >-
    Calls an authenticated upstream through the gateway, then confirms the
    resulting domain event lands on the broker topic the consumer reads.

environment:
  services:
    orders-api:
      image: myco/orders-service:latest
      httpPort: 8080
  dependencies:
    order-events:
      type: kafka
    order-cache:
      type: redis

steps:
  # ── 1. An authenticated call ──────────────────────────────────────────────
  - id: submit-priority-order
    type: http.rest
    description: Submits an order using the upstream's bearer credential.
    target: orders-api
    method: POST
    path: /orders
    headers:
      # ${secret:env/ORDERS_API_TOKEN} reads the ORDERS_API_TOKEN environment
      # variable of the process running `vouchfx`. Other sources exist (e.g.
      # ${secret:vault/path/to/key}); the shape is always source/path, and this
      # server NEVER resolves one — only the engine does, at execution time.
      Authorization: "Bearer ${secret:env/ORDERS_API_TOKEN}"
    body:
      sku: WIDGET-1
      quantity: 1
      priority: true
    expect:
      status: 201
    capture:
      orderId: "$.id"

  # ── 2. The asynchronous effect ────────────────────────────────────────────
  # `mq-expect.kafka` consumes from the topic and asserts on what arrives. Note
  # the field is `match`, not `expect`: the mq-expect family SELECTS a message
  # by criteria rather than asserting over a single fixed result. At least one
  # criterion (key, headers, payloadContains, json) must be declared — a
  # criterion-free match would accept any message on the topic and prove
  # nothing.
  #
  # RETRY is what makes this robust: the broker may not have the message the
  # instant the HTTP call returned, and polling is the engine's job, not yours.
  - id: expect-order-created-event
    type: mq-expect.kafka
    description: The order-created domain event reaches the broker topic.
    target: order-events
    topic: orders.created
    verifyMode: RETRY
    timeout: 45s
    match:
      # The captured id threads in here too, so this asserts on THE order this
      # run created rather than on any order-created event on the topic.
      json:
        $.orderId: "{orderId}"

  # ── 3. Prove the read model caught up ─────────────────────────────────────
  # A cache assertion closes the loop: the consumer processed the event and
  # populated the read model. Keyed by the captured id, so this step is tied to
  # the order step 1 actually created rather than to whatever happened to be
  # in the cache already.
  - id: assert-read-model-populated
    type: cache-assert.redis
    description: The projection worker wrote the order into the read cache.
    target: order-cache
    operation: exists
    key: "order:{orderId}"
    verifyMode: RETRY
    timeout: 30s
    expect:
      exists: true
